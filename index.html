<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سجل استهلاك الخدامين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F1; --card:#FFFFFF; --ink:#1D2B22; --ink-soft:#5C6A61;
    --green:#2F6B4F; --green-dark:#204A37; --green-pale:#E4F0E9;
    --amber:#E0812F; --amber-pale:#FBEBDA; --line:#E6E3D8; --danger:#C24B3F;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px;}

  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--green-dark);border-radius:var(--radius);color:#fff;margin-bottom:16px;}
  .top h1{font-size:18px;margin:0;font-weight:900;}
  .top .sub{font-size:12px;opacity:.75;margin-top:2px;}
  .icon-btn{background:rgba(255,255,255,.14);border:none;color:#fff;padding:0 14px;height:38px;border-radius:19px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;gap:6px;font-family:inherit;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:13px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;letter-spacing:.3px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s;}
  .chip.active{background:var(--green);border-color:var(--green);color:#fff;}
  .chip.add{border-style:dashed;color:var(--ink-soft);}

  label.field-label{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:14px 0 6px;}
  label.field-label:first-of-type{margin-top:0;}

  input[type=text], input[type=number]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-size:15px;background:#fff;color:var(--ink);}
  input:focus{outline:2px solid var(--green);outline-offset:1px;}

  .amount-wrap{position:relative;}
  .amount-wrap input{padding-left:52px;font-weight:900;font-size:18px;}
  .amount-wrap .unit{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-weight:700;font-size:14px;}

  .submit-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--amber);color:#fff;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;margin-top:16px;}
  .submit-btn:disabled{background:#D8D4C6;color:#8B8778;cursor:not-allowed;}
  .submit-btn:active:not(:disabled){transform:scale(.98);}
  .confirm-note{text-align:center;color:var(--green-dark);font-size:13px;font-weight:700;margin-top:10px;}

  .pin-screen{display:flex;flex-direction:column;align-items:center;padding:32px 16px;}
  .pin-screen p{color:var(--ink-soft);font-size:13.5px;margin:6px 0 20px;text-align:center;}
  .pin-dots{display:flex;gap:12px;margin-bottom:22px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--green);}
  .pin-dot.filled{background:var(--green);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;direction:ltr;}
  .pin-pad button{width:70px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;}
  .pin-error{color:var(--danger);font-size:13px;margin-top:10px;font-weight:700;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-top:18px;cursor:pointer;font-family:inherit;text-decoration:underline;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;padding:9px;text-align:center;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}

  .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .day-total{font-size:12px;background:var(--amber-pale);color:var(--amber);padding:4px 10px;border-radius:999px;font-weight:900;}

  .entry{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry .who{font-weight:700;font-size:14.5px;}
  .entry .what{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .entry .amount{font-weight:900;color:var(--amber);font-size:14.5px;}
  .entry .meta{display:flex;align-items:center;gap:10px;}
  .entry .time{font-size:12px;color:var(--ink-soft);}
  .entry .del{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:4px;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px 0;}

  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .name{font-weight:700;}
  .summary-row .count{color:var(--amber);font-weight:900;}

  .footer-actions{display:flex;gap:10px;}
  .footer-actions button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}

  .loading{text-align:center;padding:40px 0;color:var(--ink-soft);}
  .day-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;margin-bottom:6px;}
  .day-row.present{background:var(--green-pale);border:1px solid #b6d9c5;}
  .day-row.absent{background:#fdecea;border:1px solid #f0b8b3;}
  .day-row .day-label{font-size:13.5px;font-weight:700;}
  .day-row.present .day-label{color:var(--green-dark);}
  .day-row.absent .day-label{color:var(--danger);}
  .day-row .day-sub{font-size:12px;margin-top:2px;}
  .day-row.present .day-sub{color:var(--ink-soft);}
  .day-row.absent .day-sub{color:#c97a75;}
  .day-row .day-amount{font-weight:900;font-size:14px;color:var(--green);}
  .day-absent-badge{background:var(--danger);color:#fff;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;}
  .day-today-badge{font-size:11px;background:var(--amber);color:#fff;padding:2px 8px;border-radius:999px;font-weight:700;display:inline-block;margin-right:5px;}
  .grand-total{display:flex;justify-content:space-between;align-items:center;background:var(--green-dark);color:#fff;padding:14px 16px;border-radius:14px;margin-bottom:14px;}
  .grand-total .lbl{font-size:13px;opacity:.85;}
  .grand-total .val{font-size:20px;font-weight:900;}

  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .panel-header .name{font-size:17px;font-weight:900;}
  .switch-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit;}
  .emp-manage-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .emp-manage-row .actions{display:flex;gap:12px;}
  .emp-manage-row button{background:none;border:none;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700;}
  .emp-manage-row .pinbtn{color:var(--green);}
  .emp-manage-row .rmbtn{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">جاري التحميل...</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCBF_IwBTPIvHyc4NTAp-RuWDkun2fcC0s",
  authDomain: "sejel-khadamin.firebaseapp.com",
  projectId: "sejel-khadamin",
  storageBucket: "sejel-khadamin.firebasestorage.app",
  messagingSenderId: "764719427658",
  appId: "1:764719427658:web:75ec2f96295921656376b3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let employees=[]; // {name, pin}  (mirrored live from Firestore)
let logs=[];       // mirrored live from Firestore
let adminPin=null; // mirrored live from Firestore

let empReady=false, logsReady=false, pinReady=false;

// entry-mode sub state
let entryStage='select'; // select | pin | panel
let pendingEmployee=null;
let empPinInput='';
let empPinError='';
let unlockedEmployee=null;
let empPanelTab='today';
let amount=''; let note=''; let showConfirm=false;

// admin state
let mode='entry'; // entry | pin | admin | setpin
let pinInput=''; let pinError='';
let adminTab='today';
let detailEmployee=null;

let ready=false;

function todayStr(d=new Date()){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('ar-DZ',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateLabel(dateStr){ return new Date(dateStr+'T00:00:00').toLocaleDateString('ar-DZ',{weekday:'long',day:'numeric',month:'long'}); }
function fmtDA(n){ return Number(n).toLocaleString('en-US')+' دج'; }
function genPin(){ return String(Math.floor(1000+Math.random()*9000)); }

function checkAllReady(){
  if(empReady && logsReady && pinReady){ ready=true; }
  render();
}

function loadData(){
  db.collection('employees').onSnapshot(snap=>{
    employees = snap.docs.map(d=>({name:d.data().name, pin:d.data().pin}));
    empReady = true; checkAllReady();
  }, err=>{ console.error(err); alert('ماقدرش يتصل بقاعدة البيانات. تأكد من الإنترنت.'); });

  db.collection('logs').onSnapshot(snap=>{
    logs = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> new Date(b.ts)-new Date(a.ts));
    logsReady = true; checkAllReady();
  }, err=>{ console.error(err); });

  db.collection('meta').doc('admin').onSnapshot(docSnap=>{
    adminPin = docSnap.exists ? docSnap.data().pin : null;
    pinReady = true; checkAllReady();
  }, err=>{ console.error(err); });
}
function savePin(){ return db.collection('meta').doc('admin').set({pin: adminPin}); }

function findEmp(name){ return employees.find(e=>e.name===name); }

async function addEmployeePrompt(){
  const name = prompt('اسم الخدام الجديد:');
  if(!name || !name.trim()) return;
  let pin = prompt('حدد كود سري ديال 4 أرقام لهاذ الخدام (سيبها فارغة باش تولد وحدة عشوائية):');
  if(pin && !/^\d{4}$/.test(pin.trim())){
    alert('الكود لازم يكون 4 أرقام بالضبط. تولدت وحدة عشوائية.');
    pin=null;
  }
  if(!pin){ pin = genPin(); alert('الكود السري ديال '+name.trim()+' هو: '+pin+'\nقوليه للخدام باش يحفظو.'); }
  await db.collection('employees').doc(name.trim()).set({name:name.trim(), pin:pin.trim()});
}
async function changeEmpPin(name){
  const pin = prompt('كود سري جديد لـ '+name+' (4 أرقام):');
  if(pin && /^\d{4}$/.test(pin.trim())){
    await db.collection('employees').doc(name).update({pin: pin.trim()});
    alert('تبدل الكود.');
  } else if(pin!==null){ alert('الكود لازم يكون 4 أرقام.'); }
}
async function removeEmployee(name){
  if(!confirm('نحيو "'+name+'" من قائمة الخدامين؟')) return;
  await db.collection('employees').doc(name).delete();
}

// ---- employee self-serve flow ----
function pickEmployee(name){
  pendingEmployee = name; empPinInput=''; empPinError=''; entryStage='pin'; render();
}
function empPinPress(d){
  if(empPinInput.length<4){ empPinInput+=d; render(); }
  if(empPinInput.length===4){
    setTimeout(()=>{
      const emp = findEmp(pendingEmployee);
      if(emp && empPinInput===emp.pin){
        unlockedEmployee = pendingEmployee; empPinInput=''; empPinError=''; entryStage='panel'; empPanelTab='today';
      } else {
        empPinError='الكود خاطئ، عاود'; empPinInput='';
      }
      render();
    }, 150);
  }
}
function empPinBackspace(){ empPinInput = empPinInput.slice(0,-1); render(); }
function backToSelect(){ entryStage='select'; pendingEmployee=null; empPinInput=''; empPinError=''; render(); }
function lockOut(){ unlockedEmployee=null; entryStage='select'; amount=''; note=''; render(); }

async function submitEntry(){
  const amt = parseFloat(amount);
  if(!unlockedEmployee || !amt || amt<=0) return;
  const entryData = { employee:unlockedEmployee, amount:amt, note:(note||'').trim(), ts:new Date().toISOString() };
  const btn = document.getElementById('submitBtn');
  if(btn){ btn.disabled=true; btn.textContent='...كايسجل'; }
  try{
    await db.collection('logs').add(entryData);
    amount=''; note=''; showConfirm={amount:entryData.amount, note:entryData.note};
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    render();
    const confirmEl = document.getElementById('confirmBanner');
    if(confirmEl) confirmEl.scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(()=>{ showConfirm=false; render(); }, 2200);
  }catch(err){
    console.error(err); alert('ماقدرش يسجل، تأكد من الإنترنت وعاود.');
    render();
  }
}
async function deleteOwnEntry(id){
  const entry = logs.find(l=>l.id===id);
  if(!entry || entry.employee!==unlockedEmployee) return;
  if(!confirm('تمسح هاذا التسجيل؟')) return;
  await db.collection('logs').doc(id).delete();
}

function getEmpLogs(name){
  return logs.filter(l=>l.employee===name);
}
// Returns array of day objects from first log date to today, newest first
// Each: {date, present, total, count, entries}
function getEmpDaysList(name){
  const empLogs = logs.filter(l=>l.employee===name);
  if(empLogs.length===0) return [];
  // build map date->entries
  const map={};
  empLogs.forEach(l=>{
    const d = todayStr(new Date(l.ts));
    if(!map[d]) map[d]=[];
    map[d].push(l);
  });
  // find earliest date
  const dates = Object.keys(map).sort();
  const start = new Date(dates[0]+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const days=[];
  for(let d=new Date(today); d>=start; d.setDate(d.getDate()-1)){
    const ds = todayStr(d);
    const entries = map[ds]||[];
    const present = entries.length>0;
    const total = entries.reduce((s,l)=>s+Number(l.amount),0);
    days.push({date:ds, present, total, count:entries.length, entries});
  }
  return days;
}

// ---- admin flow ----
async function deleteEntry(id){ await db.collection('logs').doc(id).delete(); }
function getFilteredLogs(){
  if(adminTab==='today'){ const t=todayStr(); return logs.filter(l=>todayStr(new Date(l.ts))===t); }
  return logs;
}
function getSummary(list){
  const map={}; list.forEach(l=>{ map[l.employee]=(map[l.employee]||0)+Number(l.amount); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function getDailyBreakdown(name){
  // reuse getEmpDaysList
  return getEmpDaysList(name);
}
function exportCSV(){
  let rows=[['التاريخ','الوقت','الخدام','الملاحظة','المبلغ (دج)']];
  logs.slice().reverse().forEach(l=>{ const d=new Date(l.ts); rows.push([todayStr(d), fmtTime(l.ts), l.employee, l.note, l.amount]); });
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='سجل_الاستهلاك.csv'; a.click();
  URL.revokeObjectURL(url);
}
function goToManager(){ pinInput=''; pinError=''; mode = adminPin ? 'pin' : 'setpin'; render(); }
function pinPress(d){
  if(mode==='setpin'){
    if(pinInput.length<4){ pinInput+=d; render(); }
    if(pinInput.length===4){ setTimeout(()=>{ adminPin=pinInput; savePin(); pinInput=''; mode='admin'; render(); }, 150); }
    return;
  }
  if(pinInput.length<4){ pinInput+=d; render(); }
  if(pinInput.length===4){
    setTimeout(()=>{
      if(pinInput===adminPin){ pinInput=''; pinError=''; mode='admin'; } else { pinError='الكود خاطئ، عاود'; pinInput=''; }
      render();
    }, 150);
  }
}
function pinBackspace(){ pinInput = pinInput.slice(0,-1); render(); }
function exitAdmin(){ mode='entry'; render(); }

function renderPinPad(pressFn, backFn){
  return `<div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pinx="${n}">${n}</button>`).join('')}
      <button data-pinback="1">⌫</button>
      <button data-pinx="0">0</button>
      <div></div>
    </div>`;
}
function bindPinPad(pressFn, backFn){
  document.querySelectorAll('[data-pinx]').forEach(el=>el.addEventListener('click', ()=>pressFn(el.dataset.pinx)));
  document.querySelectorAll('[data-pinback]').forEach(el=>el.addEventListener('click', backFn));
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML='<div class="loading">جاري التحميل...</div>'; return; }

  // ---------- ADMIN PIN / SETUP ----------
  if(mode==='pin' || mode==='setpin'){
    app.innerHTML = `
      <div class="top">
        <div><h1>دخول المدير</h1><div class="sub">${mode==='setpin'?'حدد كود سري باش تحمي البيانات (4 أرقام)':'دخل الكود السري'}</div></div>
        <button class="icon-btn" id="backBtn">رجوع</button>
      </div>
      <div class="card pin-screen">
        <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot ${i<pinInput.length?'filled':''}"></div>`).join('')}</div>
        ${renderPinPad()}
        ${pinError?`<div class="pin-error">${pinError}</div>`:''}
      </div>`;
    document.getElementById('backBtn').addEventListener('click', ()=>{ mode='entry'; render(); });
    bindPinPad(pinPress, pinBackspace);
    return;
  }

  // ---------- ADMIN PANEL ----------
  if(mode==='admin'){
    const filtered = getFilteredLogs();
    const summary = getSummary(filtered);
    const total = filtered.reduce((s,l)=>s+Number(l.amount),0);
    app.innerHTML = `
      <div class="top">
        <div><h1>واجهة المدير</h1><div class="sub">${fmtDateLabel(todayStr())}</div></div>
        <button class="icon-btn" id="exitBtn">خروج</button>
      </div>
      <div class="grand-total"><span class="lbl">مجموع ${adminTab==='today'?'اليوم':'الكل'}</span><span class="val">${fmtDA(total)}</span></div>
      <div class="card">
        <div class="tabs">
          <div class="tab ${adminTab==='today'?'active':''}" id="tabToday">اليوم</div>
          <div class="tab ${adminTab==='all'?'active':''}" id="tabAll">الكل</div>
        </div>
        <div class="log-header"><h2 style="margin:0;">السجل التفصيلي</h2></div>
        ${filtered.length===0 ? '<div class="empty">ماكاين حتى تسجيل</div>' :
          filtered.map(l=>`
            <div class="entry">
              <div><div class="who">${l.employee}</div>${l.note?`<div class="what">${l.note}</div>`:''}</div>
              <div class="meta"><span class="amount">${fmtDA(l.amount)}</span><span class="time">${fmtTime(l.ts)}</span><button class="del" data-del="${l.id}">حذف</button></div>
            </div>`).join('')}
      </div>
      ${summary.length>0?`
      <div class="card">
        <h2>مجموع كل خدام (${adminTab==='today'?'اليوم':'الكل'})</h2>
        ${summary.map(([name,amt])=>`<div class="summary-row"><span class="name">${name}</span><span class="count">${fmtDA(amt)}</span></div>`).join('')}
      </div>`:''}

      <div class="card">
        <h2>شحال كلا كل خدام في كل يوم</h2>
        <div class="chips">
          ${employees.map(e=>`<button class="chip ${detailEmployee===e.name?'active':''}" data-detail="${e.name}">${e.name}</button>`).join('')}
        </div>
        ${detailEmployee ? (()=>{
          const days = getDailyBreakdown(detailEmployee);
          if(days.length===0) return '<div class="empty" style="margin-top:10px;">ماكاين حتى تسجيل لـ '+detailEmployee+'</div>';
          return '<div style="margin-top:12px;">' + days.map(day=>{
            const isToday = day.date===todayStr();
            if(day.present){
              const detailLines = day.entries.map(l=>`${fmtTime(l.ts)} — ${l.note||'بلا ملاحظة'} — <b>${fmtDA(l.amount)}</b> <button class="del" data-del="${l.id}" style="font-size:11px;padding:2px 6px;">حذف</button>`).join('<br>');
              return `<div class="day-row present">
                <div>
                  <div class="day-label">${isToday?'<span class="day-today-badge">اليوم</span>':''}${fmtDateLabel(day.date)}</div>
                  <div class="day-sub">${detailLines}</div>
                </div>
                <span class="day-amount">${fmtDA(day.total)}</span>
              </div>`;
            } else {
              return `<div class="day-row absent">
                <div>
                  <div class="day-label">${isToday?'<span class="day-today-badge">اليوم</span>':''}${fmtDateLabel(day.date)}</div>
                  <div class="day-sub">ما سجلش</div>
                </div>
                <span class="day-absent-badge">غائب</span>
              </div>`;
            }
          }).join('') + '</div>';
        })() : '<div class="empty">اختار خدام باش تشوف الاستهلاك تاعو يوم بيوم</div>'}
      </div>

      <div class="card">
        <h2>تسيير الخدامين</h2>
        ${employees.length===0?'<div class="empty">ماكاين حتى خدام، زيد وحد</div>':
          employees.map(e=>`
            <div class="emp-manage-row">
              <span>${e.name}</span>
              <span class="actions">
                <button class="pinbtn" data-pinchange="${e.name}">بدل الكود</button>
                <button class="rmbtn" data-rm="${e.name}">حذف</button>
              </span>
            </div>`).join('')}
        <button class="chip add" id="addEmpBtn" style="margin-top:10px;">+ خدام جديد</button>
      </div>
      <div class="footer-actions">
        <button id="exportBtn">⬇ تحميل CSV</button>
        <button id="changePinBtn">🔒 بدل كود المدير</button>
      </div>`;
    document.getElementById('exitBtn').addEventListener('click', exitAdmin);
    document.getElementById('tabToday').addEventListener('click', ()=>{ adminTab='today'; render(); });
    document.getElementById('tabAll').addEventListener('click', ()=>{ adminTab='all'; render(); });
    document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click', ()=>{ detailEmployee = (detailEmployee===el.dataset.detail)?null:el.dataset.detail; render(); }));
    document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click', ()=>deleteEntry(el.dataset.del)));
    document.getElementById('addEmpBtn').addEventListener('click', addEmployeePrompt);
    document.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click', ()=>removeEmployee(el.dataset.rm)));
    document.querySelectorAll('[data-pinchange]').forEach(el=>el.addEventListener('click', ()=>changeEmpPin(el.dataset.pinchange)));
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('changePinBtn').addEventListener('click', ()=>{ adminPin=null; mode='setpin'; pinInput=''; render(); });
    return;
  }

  // ---------- ENTRY MODE: select employee ----------
  if(entryStage==='select'){
    app.innerHTML = `
      <div class="top">
        <div><h1>سجل استهلاك الخدامين</h1><div class="sub">${fmtDateLabel(todayStr())}</div></div>
        <button class="icon-btn" id="managerBtn">👤 المدير</button>
      </div>
      <div class="card">
        <h2>شكون خدم؟ اختار سميتك</h2>
        <div class="chips">
          ${employees.map(e=>`<button class="chip" data-pick="${e.name}">${e.name}</button>`).join('')}
        </div>
        ${employees.length===0?'<div class="empty">ماكاين حتى خدام مسجل، قول للمدير يزيدك من واجهة المدير</div>':''}
        <p style="font-size:12px;color:var(--ink-soft);margin-top:14px;">🔒 بعد ما تختار سميتك، غادي يطلبلك الكود السري تاعك.</p>
      </div>`;
    document.getElementById('managerBtn').addEventListener('click', goToManager);
    document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>pickEmployee(el.dataset.pick)));
    return;
  }

  // ---------- ENTRY MODE: employee PIN ----------
  if(entryStage==='pin'){
    app.innerHTML = `
      <div class="top">
        <div><h1>${pendingEmployee}</h1><div class="sub">دخل الكود السري تاعك</div></div>
        <button class="icon-btn" id="backBtn">رجوع</button>
      </div>
      <div class="card pin-screen">
        <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot ${i<empPinInput.length?'filled':''}"></div>`).join('')}</div>
        ${renderPinPad()}
        ${empPinError?`<div class="pin-error">${empPinError}</div>`:''}
      </div>`;
    document.getElementById('backBtn').addEventListener('click', backToSelect);
    bindPinPad(empPinPress, empPinBackspace);
    return;
  }

  // ---------- ENTRY MODE: unlocked employee panel ----------
  if(entryStage==='panel'){
    const daysList = getEmpDaysList(unlockedEmployee);
    const todayDay = daysList.find(d=>d.date===todayStr());
    const todayTotal = todayDay ? todayDay.total : 0;
    const allTotal = getEmpLogs(unlockedEmployee).reduce((s,l)=>s+Number(l.amount),0);

    function renderDayRows(){
      if(daysList.length===0) return '<div class="empty">ماكاين حتى تسجيل بعد</div>';
      return daysList.map(day=>{
        const isToday = day.date===todayStr();
        if(day.present){
          const detailLines = day.entries.map(l=>`${fmtTime(l.ts)} — ${l.note||'بلا ملاحظة'} — <b>${fmtDA(l.amount)}</b> <button class="del" data-delown="${l.id}" style="font-size:11px;padding:2px 6px;">حذف</button>`).join('<br>');
          return `<div class="day-row present">
            <div>
              <div class="day-label">${isToday?'<span class="day-today-badge">اليوم</span>':''}${fmtDateLabel(day.date)}</div>
              <div class="day-sub">${detailLines}</div>
            </div>
            <span class="day-amount">${fmtDA(day.total)}</span>
          </div>`;
        } else {
          return `<div class="day-row absent">
            <div>
              <div class="day-label">${isToday?'<span class="day-today-badge">اليوم</span>':''}${fmtDateLabel(day.date)}</div>
              <div class="day-sub">ما سجلتيش</div>
            </div>
            <span class="day-absent-badge">غائب</span>
          </div>`;
        }
      }).join('');
    }

    app.innerHTML = `
      <div class="top">
        <div><h1>مرحبا ${unlockedEmployee}</h1><div class="sub">${fmtDateLabel(todayStr())}</div></div>
        <button class="icon-btn" id="lockBtn">🔒 خروج</button>
      </div>

      ${showConfirm?`<div class="card" id="confirmBanner" style="background:var(--green-pale);border-color:var(--green);text-align:center;padding:16px;">
        <div style="font-size:28px;margin-bottom:4px;">✅</div>
        <div style="font-weight:900;color:var(--green-dark);font-size:15px;">تسجل بنجاح!</div>
        <div style="color:var(--green);font-weight:700;margin-top:4px;">${fmtDA(showConfirm.amount)}${showConfirm.note?' — '+showConfirm.note:''}</div>
      </div>`:''}

      <div class="card">
        <label class="field-label">بشحال؟ (بالدينار)</label>
        <div class="amount-wrap"><input type="number" inputmode="numeric" id="amountInput" placeholder="0" value="${amount}"><span class="unit">دج</span></div>
        <label class="field-label">ملاحظة (واش أكلت/خذيت)</label>
        <input type="text" id="noteInput" placeholder="مثال: ساندويتش + عصير" value="${note}">
        <button class="submit-btn" id="submitBtn" ${(!amount || Number(amount)<=0)?'disabled':''}>سجل</button>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;">تفاصيل اليوم</h2>
          <span class="day-total">مجموع اليوم: ${fmtDA(todayTotal)}</span>
        </div>
        ${!todayDay || todayDay.entries.length===0 ? '<div class="empty">مازال ما سجلتيش شي حاجة اليوم</div>' :
          todayDay.entries.map(l=>`
            <div class="entry">
              <div><div class="what">${l.note||'بلا ملاحظة'}</div></div>
              <div class="meta"><span class="amount">${fmtDA(l.amount)}</span><span class="time">${fmtTime(l.ts)}</span><button class="del" data-delown="${l.id}">حذف</button></div>
            </div>`).join('')}
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;">السجل الكامل بالأيام</h2>
          <span class="day-total">مجموعي الكلي: ${fmtDA(allTotal)}</span>
        </div>
        ${renderDayRows()}
      </div>`;

    document.getElementById('lockBtn').addEventListener('click', lockOut);
    const amtEl = document.getElementById('amountInput');
    amtEl.addEventListener('input', e=>{ amount=e.target.value; const b=document.getElementById('submitBtn'); if(b) b.disabled = (!amount || Number(amount)<=0); });
    document.getElementById('noteInput').addEventListener('input', e=>{ note=e.target.value; });
    document.getElementById('submitBtn').addEventListener('click', submitEntry);
    document.querySelectorAll('[data-delown]').forEach(el=>el.addEventListener('click', ()=>deleteOwnEntry(el.dataset.delown)));
    return;
  }
}

loadData();
</script>
</body>
</html>
